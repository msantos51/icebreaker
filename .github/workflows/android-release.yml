# Builds the Android app (AAB for the Play Store, APK for installing directly on a phone).
# - Manually (Actions -> Android release -> Run workflow): files available as a workflow artifact.
# - On a tag such as v0.1.0: also attached to a GitHub Release.
name: Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Required secrets (Settings -> Secrets and variables -> Actions).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Optional: upload key. Without it the build is signed with the debug key (fine for testing,
      # rejected by the Play Store).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EAS_PROJECT_ID GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write google-services.json
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write upload keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64: signing with the debug key (not accepted by the Play Store)"
          fi

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install
        working-directory: app

      - run: ./gradlew bundleRelease assembleRelease --no-daemon
        working-directory: app/android

      - name: Collect files
        id: files
        run: |
          name="icebreaker-${GITHUB_REF_NAME//\//-}-${ANDROID_VERSION_CODE}"
          mkdir -p dist
          cp app/android/app/build/outputs/bundle/release/app-release.aab "dist/$name.aab"
          cp app/android/app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.name }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
