name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Compiles the local native modules (the Android SDK is available on GitHub runners).
  android-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: app
      - name: Check the local module is linked
        working-directory: app/android
        run: ./gradlew projects --no-daemon | tee projects.txt && grep -i "usage-stats" projects.txt
      - name: Compile Kotlin (app and native modules)
        working-directory: app/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
